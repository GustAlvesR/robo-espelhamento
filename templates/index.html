<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre LH · CEVA Logistics</title>
<script>
  try {
    const t = localStorage.getItem("torreLH.tema");
    if (t === "claro" || t === "escuro") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="topo">
  <a class="marca" href="{{ url_for('index') }}">
    <img class="marca-logo" src="{{ url_for('static', filename='img/logo-ceva-escuro.svg') }}" alt="CEVA Logistics">
    <span class="marca-produto">Torre LH<small>espelhamento · rotas</small></span>
  </a>
  <div class="kpis" id="kpis"></div>
  <div class="usuario">
    <span id="atualizado"></span>
    <span id="angellira"></span>
    <select id="tema" aria-label="Tema">
      <option value="">Tema: automático</option><option value="claro">Tema: claro</option><option value="escuro">Tema: escuro</option>
    </select>
    <span>{{ nome }}</span>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button type="submit" class="link">Sair</button>
    </form>
  </div>
</header>
<main class="painel">
  <aside class="lateral">
    <div class="filtros">
      <input id="busca" type="search" placeholder="Buscar LH, placa, estação…">
      <select id="fStatus">
        <option value="">Status: todos</option>
        <option>NOK</option><option>OK</option><option>Pendente</option><option>Cancelada</option>
      </select>
      <select id="fRisco">
        <option value="">Risco: todos</option>
        <option>Atraso provável</option><option>No prazo</option>
        <option>Posição antiga</option><option>Sem posição</option>
        <option>Sem coord. da estação</option><option>No destino</option><option>Encerrada</option>
      </select>
      <select id="fTrecho" aria-label="Trecho"><option value="">Trecho: todos</option></select>
    </div>
    <div class="acoes"><span id="contagem"></span><button id="exportar" type="button" class="link">Exportar CSV</button></div>
    <ul id="lista" class="lista"></ul>
  </aside>
  <section class="mapa-area">
    <div id="mapa"></div>
    <button id="verTodos" type="button" class="ver-todos" hidden>← Ver todos <kbd>Esc</kbd></button>
    <div id="detalhe" class="detalhe" hidden></div>
    <div class="legenda">
      <span><svg class="mini" viewBox="0 0 24 40" aria-hidden="true"><rect x="4.5" y="13" width="15" height="25" rx="2" fill="var(--ok)"/><rect x="6" y="2" width="12" height="10" rx="3.5" fill="var(--ok)"/></svg>OK</span><span><svg class="mini" viewBox="0 0 24 40" aria-hidden="true"><rect x="4.5" y="13" width="15" height="25" rx="2" fill="var(--nok)"/><rect x="6" y="2" width="12" height="10" rx="3.5" fill="var(--nok)"/></svg>NOK</span><span><svg class="mini" viewBox="0 0 24 40" aria-hidden="true"><rect x="4.5" y="13" width="15" height="25" rx="2" fill="var(--pend)"/><rect x="6" y="2" width="12" height="10" rx="3.5" fill="var(--pend)"/></svg>Pendente</span>
      <span><i class="pt anel"></i>Atraso provável</span>
      <span><i class="pt cidade"></i>Posição só por cidade</span>
      <span><i class="pt origem"></i>Sem posição (na origem)</span>
      <span><i class="tr previsto"></i>Trajeto não iniciado</span>
      <span><i class="tr percorrido"></i>Já percorrido (posições Angellira)</span>
      <span><i class="tr"></i>Melhor caminho agora (TomTom)</span>
      <span><i class="tr rotograma"></i>Rota do rotograma</span>
      <span><i class="pt autorizado"></i>Ponto autorizado</span>
      <span><i class="pt risco-leg"></i>Área de risco</span>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script id="dados-iniciais" type="application/json">{{ dados_iniciais|safe }}</script>
<script id="estacoes-iniciais" type="application/json">{{ estacoes_iniciais|safe }}</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
