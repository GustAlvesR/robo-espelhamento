<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Torre LH · CEVA Logistics</title>
<script>
  try {
    const t = localStorage.getItem("torreLH.tema");
    if (t === "claro" || t === "escuro") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="tela-login">
  <form class="cartao-login" method="post" autocomplete="on">
    <img class="login-logo login-logo-claro" src="{{ url_for('static', filename='img/logo-ceva.svg') }}" alt="CEVA Logistics">
    <img class="login-logo login-logo-escuro" src="{{ url_for('static', filename='img/logo-ceva-escuro.svg') }}" alt="CEVA Logistics">
    <h1>Torre LH</h1>
    <p class="intro">Espelhamento, posição e previsão das rotas de LH.</p>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Usuário ou e-mail<input type="text" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label>Senha<input type="password" name="senha" autocomplete="current-password" required></label>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
