<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torre LH · Entrar</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="tela-login">
  <form class="cartao-login" method="post" autocomplete="on">
    <div class="marca">Torre LH <span>espelhamento · rotas</span></div>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>E-mail<input type="email" name="email" required autofocus></label>
    <label>Senha<input type="password" name="senha" required></label>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
